{% extends "admin/base.html" %}

{% block title %}{% if coach %}Редактировать тренера{% else %}Добавить тренера{% endif %}{% endblock %}
{% block page_title %}{% if coach %}Редактирование тренера{% else %}Добавление тренера{% endif %}{% endblock %}

{% block content %}
<div class="card shadow">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Имя *</label>
                <input type="text" class="form-control" id="name" name="name" 
                       value="{{ coach.name if coach else '' }}" required>
            </div>
            
            <div class="mb-3">
                <label for="exp" class="form-label">Опыт (лет) *</label>
                <input type="number" class="form-control" id="exp" name="exp" 
                       value="{{ coach.experience if coach else '' }}" min="0" required>
            </div>
            
            <div class="mb-3">
                <label for="phone" class="form-label">Телефон *</label>
                <input type="tel" class="form-control" id="phone" name="phone" 
                       value="{{ coach.phone if coach else '' }}" required>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">Email *</label>
                <input type="email" class="form-control" id="email" name="email" 
                       value="{{ coach.email if coach else '' }}" required>
            </div>
            
            <div class="d-flex justify-content-between">
                <a href="{{ url_for('admin.coaches_list') }}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Назад к списку
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> {% if coach %}Сохранить изменения{% else %}Добавить тренера{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
